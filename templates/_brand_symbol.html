<!-- The SSHDeck mark, inline so it can be recoloured by the theme.

     It is INLINE rather than a symbol in icons.svg because the artwork uses a
     <mask> whose content is referenced with <use>: a browser resolves a url(#id)
     inside externally referenced <use> content against the HOST document, so the
     same mark in the sprite renders as a solid square in WebKit. Same-document
     defs have no such problem.

     Every paint is currentColor, so `color` decides: --tw-text gives the black
     mark on the one light theme and the white mark on the nine dark ones,
     matching the two files the owner delivered (static/icons/brand-black.svg,
     brand-white.svg) without a second asset or a line of JavaScript. -->
<svg width="0" height="0" aria-hidden="true" focusable="false"
     style="position: absolute; overflow: hidden" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="brand-route-a" d="M10 240H158C199 240 222 219 250 188L405 -20C417 -34 438 -35 452 -23C466 -11 467 10 454 24L297 226C279 246 279 266 297 286L396 397C408 410 407 429 394 440C381 451 362 450 351 437L250 324C222 293 199 272 158 272H10C-3 272 -12 266 -12 256C-12 246 -3 240 10 240Z"/>
    <path id="brand-route-b" d="M-105 240H158C199 240 222 219 250 188L400 6C411 -7 429 -8 442 2C455 13 456 30 445 42L297 226C279 246 279 266 297 286L405 402C418 416 417 437 403 449C389 461 368 459 356 445L248 326C221 295 199 272 158 272H-105C-118 272 -127 266 -127 256C-127 246 -118 240 -105 240Z"/>

    <mask id="brand-cutout">
      <rect width="512" height="512" fill="white"/>
      <g fill="black">
        <use href="#brand-route-a" transform="translate(256 256) rotate(-10) scale(.64) translate(-225 -256)"/>
        <use href="#brand-route-b" transform="translate(256 256) rotate(148) scale(.64) translate(-225 -256)"/>
      </g>
    </mask>
  <symbol id="icon-brand" viewBox="0 0 512 512">

  <g transform="translate(256 256) scale(1.28) translate(-256 -256)">
    <rect x="64" y="64" width="384" height="384" rx="96" fill="currentColor" stroke="none" mask="url(#brand-cutout)"/>

    <circle cx="256" cy="256" r="18" fill="currentColor" stroke="none"/>
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M230 245Q219 256 230 267"/>
      <path d="M282 245Q293 256 282 267" transform="rotate(-45 256 256)"/>
      <path d="M282 245Q293 256 282 267" transform="rotate(45 256 256)"/>
    </g>
  </g>
    </symbol>
  </defs>
</svg>
