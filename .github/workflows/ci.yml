name: CI

# One workflow, because `needs:` only orders jobs INSIDE a workflow. While the
# image lived in a second workflow file, a push to main started the build and
# the tests at the same moment and the image could be published while the tests
# were still running -- or after they had already failed. Nothing here can
# publish until all three test jobs are green.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Mirror the runtime version shipped in the Docker image.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests
        # tests/integration needs a real sshd and skips itself without one.
        run: pytest tests/ -v

  gates:
    name: browser gates
    runs-on: ubuntu-latest
    # The gates drive real Chromium and WebKit pages. They are the only place
    # the UI contracts are checked at all, so a pull request that changes the
    # shell or the terminal is not reviewable without them.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        # Both engines: a defect that stops input on Safari cannot be seen on
        # Chromium, which is why several gates run WebKit as well.
        run: npx playwright install --with-deps chromium webkit

      - name: Unit tests for the shared JS helpers
        run: npm run test:js

      - name: Run the browser gates
        # Live gates are excluded by default: they need a real SSHDeck and a
        # real SSH target, which CI has neither of. run_gates re-runs a red
        # gate on its own before reporting it, so a flake is labelled, not
        # mistaken for a regression.
        run: node scripts/run_gates.mjs

  vendored-assets:
    name: vendored assets and notices
    runs-on: ubuntu-latest
    # static/vendor/ is committed, not built at deploy time, so it can drift
    # from package.json. It once shipped four libraries with their copyright
    # notices missing, which their licences forbid; and socket.io is BUILT here
    # rather than copied, because upstream's prebuilt bundle inlines a
    # vulnerable parser. Re-vendoring and demanding an empty diff proves the
    # committed tree is what the pinned versions actually produce.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: No known vulnerability in a shipped dependency
        run: npm audit --audit-level=high

      - name: Re-vendor from the pinned versions
        run: npm run vendor

      - name: The committed assets must match what was just produced
        run: git diff --exit-code --stat static/vendor/

      - name: Every third-party notice is present
        run: |
          set -e
          for f in LICENSE NOTICE.md UPSTREAM-MIT-LICENSE.txt \
                   static/vendor/xterm/LICENSE \
                   static/vendor/highlight/LICENSE \
                   static/vendor/socketio/LICENSE \
                   static/vendor/material-icons/LICENSE; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          echo "all notices present"

  docker:
    name: docker image
    runs-on: ubuntu-latest
    # THE GATE. Nothing is built or published until every suite is green, and
    # a pull request builds the image without pushing it so a broken Dockerfile
    # is caught before it reaches main.
    needs: [pytest, gates, vendored-assets]
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
